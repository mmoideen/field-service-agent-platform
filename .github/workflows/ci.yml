name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldservice
          POSTGRES_PASSWORD: fieldservice
          POSTGRES_DB: fieldservice_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run ruff linting
        run: |
          ruff check backend/

      - name: Run mypy type checking
        run: |
          mypy backend/app/

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://fieldservice:fieldservice@localhost:5432/fieldservice_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest backend/tests/ --cov=backend/app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage

  frontend-build:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type checking
        working-directory: frontend
        run: npm run typecheck

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          BUNDLE_SIZE=$(du -sm dist | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE}MB"
          if [ $BUNDLE_SIZE -gt 5 ]; then
            echo "Error: Bundle size exceeds 5MB"
            exit 1
          fi

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for TODOs in production code
        run: |
          TODO_COUNT=$(grep -rc "TODO" backend/app frontend/src | awk -F: '{ total += $2 } END { print total + 0 }')
          if [ "$TODO_COUNT" -gt 0 ]; then
            echo "Warning: Found $TODO_COUNT TODOs in production code"
            grep -rn "TODO" backend/app frontend/src || true
          fi

      - name: Verify no hardcoded secrets
        run: |
          PATTERN='sk-[A-Za-z0-9]{20,}|(password|secret|token|api[_-]?key)[[:space:]]*[=:][[:space:]]*["'"'"'][^"'"'"']+["'"'"']'
          if grep -rInE "$PATTERN" backend/app backend/tests frontend/src packages scripts infra; then
            echo "Error: Potential hardcoded secrets detected"
            exit 1
          fi

      - name: All quality gates passed
        run: echo "All quality gates passed successfully"
